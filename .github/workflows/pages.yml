name: Build Karaoke Studio website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build:pages
        env:
          KARAOKE_API_URL: ${{ vars.KARAOKE_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
          retention-days: 3
